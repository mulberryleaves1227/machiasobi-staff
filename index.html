<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マチ★アソビ vol.31 スタッフナビ</title>
<noscript><meta http-equiv="refresh" content="0; url=./home/index.html"></noscript>
<script>
// 旧 index.html?tab=xxx（タブ式SPA時代のURL）を新しいページディレクトリへ転送する
// LIFF（https://liff.line.me/<LIFF ID>/timeline/index.html など）から来た場合は
// ?liff.state=/timeline/index.html が付くので、そのページへ転送する
(function () {
  var TAB_TO_PAGE = { home: 'home', report: 'report', shift: 'shift', tt: 'timeline', map: 'area', basic: 'basic' };
  var params = new URLSearchParams(location.search);
  var liffState = params.get('liff.state');
  if (liffState && /^\/[\w\-./]*(\?[^#]*)?$/.test(liffState) && liffState.indexOf('//') === -1) {
    location.replace('.' + liffState);
    return;
  }
  var page = TAB_TO_PAGE[params.get('tab')] || 'home';
  params.delete('tab');
  var qs = params.toString();
  location.replace('./' + page + '/index.html' + (qs ? '?' + qs : ''));
})();
</script>
</head>
<body></body>
</html>
