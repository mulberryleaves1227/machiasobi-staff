<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マチ★アソビ vol.30 スタッフナビ</title>
<noscript><meta http-equiv="refresh" content="0; url=./home/"></noscript>
<script>
// 旧 index.html?tab=xxx（タブ式SPA時代のURL）を新しいページディレクトリへ転送する
(function () {
  var TAB_TO_PAGE = { home: 'home', report: 'report', shift: 'shift', tt: 'timeline', map: 'area', basic: 'basic' };
  var params = new URLSearchParams(location.search);
  var page = TAB_TO_PAGE[params.get('tab')] || 'home';
  params.delete('tab');
  var qs = params.toString();
  location.replace('./' + page + '/' + (qs ? '?' + qs : ''));
})();
</script>
</head>
<body></body>
</html>
